name: Test and release Linux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 xvfb xauth
          python3 -m pip install -r requirements.txt
      - name: Test Linux desktop and commands
        run: |
          python3 -m compileall -q .
          xvfb-run -a python3 -m unittest discover -s tests -v
  publish:
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Package, smoke-test and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 jarvis.py --version | awk '{print $3}')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          bundle="jarvis-linux-$version"
          mkdir -p "$RUNNER_TEMP/$bundle"
          cp -r -- *.py *.md *.sh *.txt LICENSE assets native installer "$RUNNER_TEMP/$bundle/"
          rustc --crate-type cdylib -O native/audio.rs -o "$RUNNER_TEMP/$bundle/libjarvis_audio.so"
          tar -C "$RUNNER_TEMP" -czf "$bundle.tar.gz" "$bundle"
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf "$bundle.tar.gz"
          printf 'запиши заметку Linux\nпокажи заметки\nвыход\n' |
            XDG_DATA_HOME="$RUNNER_TEMP/smoke/data" python3 "$RUNNER_TEMP/smoke/$bundle/jarvis.py" |
            grep -F '1. Linux'
          sha256sum "$bundle.tar.gz" > SHA256SUMS.txt
          gh release create "$tag" "$bundle.tar.gz" SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "JARVIS Linux $version" --notes 'Графический рабочий стол, локальные Piper и Whisper, CS2, War Thunder, OCR, журнал systemd и запуск приложений Linux. См. README для настройки и ограничений Wayland.'
